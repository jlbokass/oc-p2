services:
  frontend:
    image: node:22-bookworm
    working_dir: /app

    command: >
      sh -c "npm ci &&
             npm run start -- --host 0.0.0.0 --poll 1000"

    ports:
      - "4200:4200"

    volumes:
      - ./repos/frontend:/app
      - frontend_node_modules:/app/node_modules

volumes:
  frontend_node_modules: