services:
  frontend:
    image: node:22-bookworm
    working_dir: /app

    command: >
      sh -c "npm ci &&
             npm run start -- --host 0.0.0.0 --poll 1000 --proxy-config /docker/frontend-proxy.conf.json"

    ports:
      - "127.0.0.1:4200:4200"

    volumes:
      - ./repos/frontend:/app
      - frontend_node_modules:/app/node_modules
      - ./docker/frontend-proxy.conf.json:/docker/frontend-proxy.conf.json:ro

    depends_on:
      - backend

  mysql:
    image: mysql:8.4

    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}

    ports:
      - "127.0.0.1:3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    image: maven:3.9.11-eclipse-temurin-21
    working_dir: /app

    command: mvn spring-boot:run

    ports:
      - "127.0.0.1:8080:8080"

    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS}
      SPRING_DOCKER_COMPOSE_ENABLED: "false"

    volumes:
      - ./repos/backend:/app
      - maven_cache:/root/.m2

    depends_on:
      - mysql

volumes:
  frontend_node_modules:
  maven_cache:
  mysql_data: